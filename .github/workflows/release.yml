name: Release X4 Pro firmware

# Releases are published from a clean checkout of the tag built on the maintainer's
# build host and signed there (release-x4pro.sh), because a second cold build here
# added ~11 minutes before the firmware could be tested.
#
# On a tag push this workflow is the INDEPENDENT CHECK of that release: it rebuilds
# the same tag from a clean checkout and refuses if the image it produces does not
# match the published firmware.json (same SHA-256, same stamp, features present).
#
# Run it manually (workflow_dispatch) with publish=true to build AND publish here
# instead -- the fallback when the build host is unavailable.
#
#   bluecarrel-x4pro-<stamp>.bin       app image: Bluetooth updates, or USB at 0x10000
#   bluecarrel-x4pro-<stamp>.bin.sig   its signature (hex), for /firmware/firmware.bin.sig
#   bluecarrel-x4pro-<stamp>-full.bin  bootloader + partition table + app from 0x0
#   firmware.json                      {version, file, size, sha256, signature}
#
# A tag ending in -test (x4pro-<stamp>-test) is a pre-release. The app's default
# update page (releases/latest) skips pre-releases.

on:
  push:
    tags:
      - 'x4pro-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (x4pro-yyyyMMdd.HHmm[-test])'
        required: true
      publish:
        description: 'Publish the release from here instead of only checking it'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PIO_ENV: x4pro-gh_release
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLISH: ${{ inputs.publish || false }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          submodules: recursive

      - name: Build stamp from tag
        run: |
          rest="${TAG#x4pro-}"
          prerelease=false
          if [[ "$rest" == *-test ]]; then
            rest="${rest%-test}"
            prerelease=true
          fi
          if ! [[ "$rest" =~ ^[0-9]{8}\.[0-9]{4}$ ]]; then
            echo "Tag must be x4pro-yyyyMMdd.HHmm or x4pro-yyyyMMdd.HHmm-test, got $TAG" >&2
            exit 1
          fi
          echo "X4_BUILD_STAMP=$rest" >> "$GITHUB_ENV"
          echo "X4_PRERELEASE=$prerelease" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core and esptool
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder imports these unconditionally and its own
          # penv bootstrap does not install them reliably on this runner image.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0" "esptool>=4.8"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build
        run: pio run -e "$PIO_ENV" -j1

      # A release must be the firmware that was tested: refuse an image missing the
      # Bluetooth link (a release env once lost FREEINK_CAP_BLE_TRANSFER unnoticed).
      - name: Check the image has the X4 Pro features
        run: |
          image=".pio/build/$PIO_ENV/firmware.bin"
          grep -q "\"$X4_BUILD_STAMP\"" src/network/BuildStamp.h
          for marker in "X4AUTH2|host|" "X4FW1|" "Bluecarrel"; do
            if ! grep -aqF "$marker" "$image"; then
              echo "::error::$image is missing '$marker'; the release env does not match env:x4pro"
              exit 1
            fi
          done

      # The published release was built and signed elsewhere. This is what makes that
      # safe: the same tag, rebuilt from a clean checkout here, must produce the same
      # image bytes as the one being served to readers.
      - name: Check the published release matches this build
        if: env.PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(sha256sum ".pio/build/$PIO_ENV/firmware.bin" | cut -d' ' -f1)
          # The release is created right after the tag is pushed, so allow for it landing late.
          # Waiting is only for "not published yet"; any other download failure stops here.
          for attempt in $(seq 1 30); do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p firmware.json \
                -O published-firmware.json --clobber
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::No release for $TAG after 5 minutes. Publish it (release-x4pro.sh), or re-run this workflow with publish=true."
              exit 1
            fi
            sleep 10
          done
          published=$(python -c 'import json;print(json.load(open("published-firmware.json"))["sha256"])')
          version=$(python -c 'import json;print(json.load(open("published-firmware.json"))["version"])')
          echo "published $version $published"
          echo "rebuilt   $X4_BUILD_STAMP $built"
          if [ "$version" != "$X4_BUILD_STAMP" ]; then
            echo "::error::firmware.json says version $version, this tag is $X4_BUILD_STAMP"
            exit 1
          fi
          if [ "$published" != "$built" ]; then
            echo "::error::The published image does not match a clean rebuild of $TAG. Do not install it."
            exit 1
          fi
          echo "The published image matches a clean rebuild of $TAG."

      # On a mismatch, keep this build so the two images can be compared byte for byte.
      - name: Keep the rebuilt image for comparison
        if: failure() && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-${{ env.TAG }}
          path: |
            .pio/build/${{ env.PIO_ENV }}/firmware.bin
            .pio/build/${{ env.PIO_ENV }}/firmware.map
          retention-days: 14

      # Written after the build so no build script runs while the key is on disk.
      - name: Write signing key
        if: env.PUBLISH == 'true'
        env:
          FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -z "$FIRMWARE_SIGNING_KEY" ]; then
            echo "::error::The FIRMWARE_SIGNING_KEY secret is empty or not set; refusing to release unsigned firmware"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/firmware-signing-key.pem"
          printf '%s\n' "$FIRMWARE_SIGNING_KEY" > "$key"
          chmod 600 "$key"

      - name: Package
        if: env.PUBLISH == 'true'
        env:
          FIRMWARE_SIGNING_KEY_FILE: ${{ runner.temp }}/firmware-signing-key.pem
        run: |
          build=".pio/build/$PIO_ENV"
          scripts/make_firmware_json.sh dist "$build/firmware.bin"
          test -s "dist/bluecarrel-x4pro-$X4_BUILD_STAMP.bin.sig"
          grep -q '"signature":"' dist/firmware.json
          # merge_bin fills the gap over otadata (0xe000) with 0xFF, so the reader boots app0.
          python -m esptool --chip esp32s3 merge_bin -o "dist/bluecarrel-x4pro-$X4_BUILD_STAMP-full.bin" \
            0x0 "$build/bootloader.bin" 0x8000 "$build/partitions.bin" 0x10000 "$build/firmware.bin"
          (cd dist && sha256sum *.bin *.sig > SHA256SUMS)
          ls -l dist

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/firmware-signing-key.pem"

      - name: Publish release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          title="Bluecarrel firmware for X4 Pro $X4_BUILD_STAMP"
          if [ "$X4_PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
            title="$title (test)"
          fi
          gh release create "$TAG" dist/* "${flags[@]}" \
            --title "$title" \
            --notes "Install over Bluetooth from the Bluecarrel app (https://github.com/jaymart1983/bluecarrel-app), or over USB: see the README (First install over USB). \`firmware.json\` can be served from your own update page."
